on:
  # Trigger analysis when pushing to your main branches, and when creating a pull request.
  push:
    branches:
      - main
      - master
      - develop
      - 'releases/**'
  pull_request:
      types: [opened, synchronize, reopened]

name: SonarQube
jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Disabling shallow clones is recommended for improving the relevancy of reporting
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Ensure test tools are available even if not listed in requirements
        pip install -r requirements.txt || true
        pip install pytest pytest-cov

    - name: Run tests and produce coverage/junit reports
      env:
        PYTHONPATH: ${{ github.workspace }}/tutorial
      run: |
        mkdir -p reports
        pytest --junitxml=reports/junit.xml --cov=tutorial --cov-report=xml:reports/coverage.xml -q
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v6.0.0 # Ex: v4.1.0 or sha1, See the latest version at https://github.com/marketplace/actions/official-sonarqube-scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Ensure Sonar scanner can find the generated reports
        SONAR_PROPERTIES: |
          sonar.python.coverage.reportPaths=reports/coverage.xml
          sonar.python.xunit.reportPath=reports/junit.xml
