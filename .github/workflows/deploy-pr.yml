name: Deploy Dev

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Git reference (tag or branch) to deploy as dev"
        default: ""
        required: false

jobs:
    build_image:
      name: Build Image
      permissions:
        contents: read
        packages: write
      environment:
        name: dev
        url: https://github.com/ValentinHerrmann/SQLution/pkgs/container/sqlution/dev
      runs-on: ubuntu-latest
      if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
      outputs:
        image_ref: ${{ steps.choose-image.outputs.image }}
      steps:
        - name: Compute image metadata
          id: meta
          env:
            INPUT_DEPLOY_REF: ${{ inputs.deploy_ref }}
          run: |
            set -euo pipefail
            OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
            IMAGE="ghcr.io/${OWNER}/sqlution"
            REF_BASIS="${INPUT_DEPLOY_REF:-${GITHUB_REF_NAME}}"
            SAFE_REF=$(echo "${REF_BASIS}" | tr '[:upper:]' '[:lower:]' | tr '/ ' '--')
            TMP_TAG="${IMAGE}:dev"
            echo "tmp_tag=${TMP_TAG}" >> "$GITHUB_OUTPUT"

        - name: Log in to GitHub Container Registry
          if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            ref: ${{ inputs.deploy_ref || github.ref }}

        - name: Set VERSION file
          env:
            EVENT_NAME: ${{ github.event_name }}
            REF_NAME: ${{ github.ref_name }}
            DISPATCH_REF: ${{ inputs.deploy_ref }}
          run: |
            set -euo pipefail
            TARGET_REF="$REF_NAME"
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${DISPATCH_REF:-}" ]; then
              TARGET_REF="$DISPATCH_REF"
            fi
            printf '%s\n' "$TARGET_REF" > VERSION
            echo "VERSION file set to $TARGET_REF"

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build and push image
          uses: docker/build-push-action@v5
          with:
            context: .
            file: Dockerfile
            push: true
            cache-from: type=gha
            cache-to: type=gha,mode=max
            tags: |
              ${{ steps.meta.outputs.tmp_tag }}

        - name: Select image to use
          id: choose-image
          run: echo "image=${{ steps.meta.outputs.tmp_tag }}" >> "$GITHUB_OUTPUT"

    configure_nginx:
      name: Configure NGINX
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      permissions:
        contents: read
      environment:
        name: dev
        url: https://dev.sqlution.de
      runs-on: ubuntu-latest
      steps:
        - name: Configure nginx with SSL preservation
          uses: appleboy/ssh-action@v0.1.7
          with:
            host: ${{ vars.DEPLOY_HOST }}
            username: ${{ secrets.DEPLOY_USER }}
            key: ${{ secrets.DEPLOY_SSH_KEY }}
            port: ${{ secrets.DEPLOY_PORT || '22' }}
            script: |
              set -euo pipefail
              sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
              sudo find /etc/nginx/sites-enabled -type l ! -exec test -e {} \; -delete
              
              # Capture existing HTTPS server block if it exists (only the 443 block)
              HTTPS_BLOCK=""
              if [ -f /etc/nginx/sites-available/sqlution-dev ]; then
                # Check if HTTPS config exists by looking for listen 443
                if sudo grep -q 'listen.*443' /etc/nginx/sites-available/sqlution-dev 2>/dev/null; then
                  # Extract only the server block containing listen 443
                  HTTPS_BLOCK=$(sudo awk '/^server \{/{p=1; buf=""} p{buf=buf $0 "\n"; if(/listen.*443/) found=1} /^\}/ && p{if(found) print buf; p=0; found=0; buf=""}' /etc/nginx/sites-available/sqlution-dev)
                fi
              fi
              
              # Always create HTTP config
              # Use NGINX_CLIENT_MAX_BODY_SIZE (default 100M) to set client_max_body_size
              NGINX_CLIENT_MAX_BODY_SIZE=${NGINX_CLIENT_MAX_BODY_SIZE:-100M}
              if ! printf '%s' "$NGINX_CLIENT_MAX_BODY_SIZE" | grep -Eq '^[0-9]+([KMGkmg]?|[KMGkmg]?B)$'; then
                echo "Invalid NGINX_CLIENT_MAX_BODY_SIZE: $NGINX_CLIENT_MAX_BODY_SIZE" >&2
                exit 1
              fi
              export NGINX_CLIENT_MAX_BODY_SIZE
              # write template with literal placeholder, then substitute only the client_max value
              cat <<'EOF' > /tmp/sqlution-dev.conf
              upstream sqlution_dev {
                server 127.0.0.1:8001;
              }

              server {
                server_name dev.sqlution.de;
                listen 80;
                listen [::]:80;

                # limit request body size for uploads
                client_max_body_size \\${NGINX_CLIENT_MAX_BODY_SIZE};

                location / {
                  proxy_pass http://sqlution_dev;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                }
              }
              EOF

              # Replace the placeholder with the actual size (preserve other $-variables)
              # Use envsubst to only substitute NGINX_CLIENT_MAX_BODY_SIZE and leave nginx $-variables intact
              sudo envsubst '${NGINX_CLIENT_MAX_BODY_SIZE}' < /tmp/sqlution-dev.conf | sudo tee /etc/nginx/sites-available/sqlution-dev > /dev/null
              sudo rm -f /tmp/sqlution-dev.conf
              
              # If HTTPS block exists, append it (ensure client_max_body_size is present)
              if [ -n "$HTTPS_BLOCK" ]; then
                # Inject client_max_body_size into each server block if missing
                printf '%s' "$HTTPS_BLOCK" | awk -v size="$NGINX_CLIENT_MAX_BODY_SIZE" 'BEGIN{RS="\n\n"; ORS="\n\n"} { if ($0 !~ /client_max_body_size/) { sub(/server[ \t]*\{/, "server {\n    client_max_body_size " size ";") } print }' | sudo tee -a /etc/nginx/sites-available/sqlution-dev > /dev/null
              else
                # No HTTPS config exists, run certbot to obtain SSL certificate
                echo "No HTTPS configuration found, running certbot..."
                sudo certbot --nginx -d dev.sqlution.de --non-interactive --agree-tos --redirect || echo "Certbot failed, continuing with HTTP only"
              fi
              
              sudo ln -sf /etc/nginx/sites-available/sqlution-dev /etc/nginx/sites-enabled/sqlution-dev
              sudo nginx -t
              sudo systemctl reload nginx

    stop:
      name: Stop running Container
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      permissions:
        contents: read
      environment:
        name: dev
        url: https://dev.sqlution.de
      runs-on: ubuntu-latest
      steps:
        - name: Stop dev application over SSH
          uses: appleboy/ssh-action@v0.1.7
          with:
            host: ${{ vars.DEPLOY_HOST }}
            username: ${{ secrets.DEPLOY_USER }}
            key: ${{ secrets.DEPLOY_SSH_KEY }}
            port: ${{ secrets.DEPLOY_PORT || '22' }}
            script: |
              set -euo pipefail
              docker container stop sqlution-app-dev || true
              docker container rm sqlution-app-dev || true

    launch:
      name: Launch Container
      needs: [build_image, configure_nginx, stop]
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      permissions:
        contents: read
      runs-on: ubuntu-latest
      environment:
        name: dev
        url: https://dev.sqlution.de
      env:
        SQLUTION_IMAGE: ${{ needs.build_image.outputs.image_ref }}
        REGISTRY_USER: ${{ secrets.DEPLOY_REGISTRY_USER }}
        REGISTRY_TOKEN: ${{ secrets.DEPLOY_REGISTRY_TOKEN }}
        DJANGO_STATIC_URL: ${{ vars.DJANGO_STATIC_URL || '/app-static/' }}
      steps:
        - name: Pull image on server
          uses: appleboy/ssh-action@v0.1.7
          with:
            host: ${{ vars.DEPLOY_HOST }}
            username: ${{ secrets.DEPLOY_USER }}
            key: ${{ secrets.DEPLOY_SSH_KEY }}
            port: ${{ secrets.DEPLOY_PORT || '22' }}
            envs: SQLUTION_IMAGE,REGISTRY_USER,REGISTRY_TOKEN
            script: |
              set -euo pipefail
              if [ -z "${REGISTRY_USER:-}" ] || [ -z "${REGISTRY_TOKEN:-}" ]; then
                echo "Missing registry credentials (DEPLOY_REGISTRY_USER / DEPLOY_REGISTRY_TOKEN)." >&2
                exit 1
              fi
              echo "Pulling ${SQLUTION_IMAGE} on server"
              echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin
              docker pull "${SQLUTION_IMAGE}"

        - name: Run dev container on server
          uses: appleboy/ssh-action@v0.1.7
          env:
            DJANGO_ALLOWED_HOSTS: ${{ vars.DJANGO_ALLOWED_HOSTS || 'dev.sqlution.de,localhost,127.0.0.1' }}
            DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_DEBUG_MODE: ${{ vars.DJANGO_DEBUG_MODE || 'true' }}
            DEPLOY_APP_DIR: ${{ vars.DEPLOY_APP_DIR }}
            DJANGO_STATIC_URL: ${{ vars.DJANGO_STATIC_URL || '/app-static/' }}
            # Pass upload limits (in bytes) into the container; default 100MB
            FILE_UPLOAD_MAX_MEMORY_SIZE: ${{ vars.FILE_UPLOAD_MAX_MEMORY_SIZE || '104857600' }}
            DATA_UPLOAD_MAX_MEMORY_SIZE: ${{ vars.DATA_UPLOAD_MAX_MEMORY_SIZE || '104857600' }}
            NGINX_CLIENT_MAX_BODY_SIZE: ${{ vars.NGINX_CLIENT_MAX_BODY_SIZE || '100M' }}
          with:
            host: ${{ vars.DEPLOY_HOST }}
            username: ${{ secrets.DEPLOY_USER }}
            key: ${{ secrets.DEPLOY_SSH_KEY }}
            port: ${{ secrets.DEPLOY_PORT || '22' }}
            envs: SQLUTION_IMAGE,DJANGO_ALLOWED_HOSTS,DJANGO_SECRET_KEY,DJANGO_DEBUG_MODE,DEPLOY_APP_DIR,DJANGO_STATIC_URL
            script: |
              set -euo pipefail
              cd "${DEPLOY_APP_DIR}"
              echo "Launching ${SQLUTION_IMAGE}"
              docker run -d \
                --restart unless-stopped \
                --name sqlution-app-dev \
                -p 8001:8000 \
                -e SECRET_KEY="${DJANGO_SECRET_KEY}" \
                -e DEBUG_MODE="${DJANGO_DEBUG_MODE}" \
                -e DJANGO_ALLOWED_HOSTS="${DJANGO_ALLOWED_HOSTS}" \
                -e DJANGO_STATIC_URL="${DJANGO_STATIC_URL}" \
                -e SQLUTION_DB_DIR='/data' \
                -e FILE_UPLOAD_MAX_MEMORY_SIZE="${FILE_UPLOAD_MAX_MEMORY_SIZE}" \
                -e DATA_UPLOAD_MAX_MEMORY_SIZE="${DATA_UPLOAD_MAX_MEMORY_SIZE}" \
                -v sqlution-db-dev:/data \
                -v "${DEPLOY_APP_DIR}/user_databases:/app/tutorial/user_databases" \
                "${SQLUTION_IMAGE}"
