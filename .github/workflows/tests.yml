name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-html pytest-json-report

    - name: 🗃️ Set up database
      env:
        PYTHONPATH: ${{ github.workspace }}/tutorial
      run: |
        cd tutorial
        python manage.py migrate --noinput

    - name: 🧪 Run tests with coverage
      env:
        PYTHONPATH: ${{ github.workspace }}/tutorial
      run: |
        mkdir -p reports
        pytest \
          --cov=tutorial \
          --cov-report=xml:reports/coverage.xml \
          --cov-report=html:reports/htmlcov \
          --cov-report=term-missing \
          --junitxml=reports/junit.xml \
          --html=reports/test-report.html \
          --self-contained-html \
          --json-report \
          --json-report-file=reports/test-report.json \
          -v

    - name: 📊 Coverage Report
      uses: orgoro/coverage@v3.2
      with:
        coverageFile: reports/coverage.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        thresholdAll: 0.0
        thresholdNew: 0.0
        thresholdModified: 0.0

    - name: 📈 Test Summary
      uses: test-summary/action@v2
      with:
        paths: reports/junit.xml
      if: always()

    - name: 💬 Add Coverage Comment
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COVERAGE_DATA_BRANCH: coverage-data
        MINIMUM_GREEN: 80
        MINIMUM_ORANGE: 60
      if: github.event_name == 'pull_request'

    - name: 📊 Coverage Badge
      if: matrix.python-version == '3.11' && github.ref == 'refs/heads/main'
      run: |
        pip install coverage-badge
        coverage-badge -o reports/coverage.svg -f

    - name: 📤 Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-python-${{ matrix.python-version }}
        path: reports/
        retention-days: 30
      if: always()

    - name: 📤 Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results-python-${{ matrix.python-version }}
        path: reports/junit.xml
        retention-days: 30
      if: always()

    - name: ✅ Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always() && github.event_name == 'pull_request'
      with:
        files: reports/junit.xml
        check_name: Test Results (Python ${{ matrix.python-version }})
        comment_title: 🧪 Test Results (Python ${{ matrix.python-version }})
        
  test-summary:
    name: 📋 Test Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
    - name: 📥 Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-reports
        
    - name: 📊 Display Summary
      run: |
        echo "## 🎉 Test Run Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📁 Artifacts Generated:" >> $GITHUB_STEP_SUMMARY
        echo "- Coverage Reports (HTML)" >> $GITHUB_STEP_SUMMARY
        echo "- Test Results (JUnit XML)" >> $GITHUB_STEP_SUMMARY
        echo "- Coverage Data (XML)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "View the artifacts in the workflow run summary above! ☝️" >> $GITHUB_STEP_SUMMARY
