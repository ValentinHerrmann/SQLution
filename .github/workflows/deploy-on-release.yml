name: Deploy Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Git reference (tag or branch) to deploy"
        default: ""
        required: false

jobs:
  build_image:
    name: Build and publish container image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/sqlution"
          SHA_TAG="${IMAGE}:${GITHUB_SHA}"
          SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/ ' '--')
          BRANCH_TAG="${IMAGE}:${SAFE_REF}"
          echo "image_ref=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.branch_tag }}

  stop:
    name: Stop running application
    needs: build_image
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      SQLUTION_IMAGE: ${{ needs.build_image.outputs.image_ref }}
    steps:
      - name: Stop application over SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: SQLUTION_IMAGE
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_APP_DIR }}"
            mkdir -p tutorial/user_databases
            SQLUTION_IMAGE="$SQLUTION_IMAGE" docker compose -f compose.yaml down
            docker image prune -af || true

  launch:
    name: Launch new container
    needs:
      - build_image
      - stop
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sqlution.de
    env:
      SQLUTION_IMAGE: ${{ needs.build_image.outputs.image_ref }}
      REGISTRY_USER: ${{ secrets.DEPLOY_REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.DEPLOY_REGISTRY_TOKEN }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: SQLUTION_IMAGE,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            set -euo pipefail
            if [ -z "${REGISTRY_USER:-}" ] || [ -z "${REGISTRY_TOKEN:-}" ]; then
              echo "Missing registry credentials (DEPLOY_REGISTRY_USER / DEPLOY_REGISTRY_TOKEN)." >&2
              exit 1
            fi
            cd "${{ secrets.DEPLOY_APP_DIR }}"
            echo "Logging into GHCR and pulling ${SQLUTION_IMAGE}"
            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            docker pull "$SQLUTION_IMAGE"
            export SQLUTION_IMAGE
            SQLUTION_IMAGE="$SQLUTION_IMAGE" docker compose -f compose.yaml up -d --no-build --remove-orphans
            rm -f ./last_launched.txt
            TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S TZ=Eu/Ber' > ./last_launched.txt
            