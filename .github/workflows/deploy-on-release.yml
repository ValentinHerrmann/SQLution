name: Deploy Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Git reference (tag or branch) to deploy"
        default: ""
        required: false

jobs:
  deploy:
    name: Deploy to sqlution.de
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sqlution.de
    env:
      DEPLOY_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || (inputs.deploy_ref != '' && inputs.deploy_ref || github.ref_name) }}
      DEPLOY_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy over SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: DEPLOY_REF,DEPLOY_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_APP_DIR }}"
            git fetch origin --tags --prune
            git checkout "$DEPLOY_REF"
            git reset --hard "$DEPLOY_REF"
            export DEPLOY_TAG="$DEPLOY_REF"
            bash update_and_launch.sh
