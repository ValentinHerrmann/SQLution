name: Deploy Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Git reference (tag or branch) to deploy"
        default: ""
        required: false

jobs:
  deploy:
    name: Deploy to sqlution.de
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sqlution.de
    env:
      DEPLOY_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || (inputs.deploy_ref != '' && inputs.deploy_ref || github.ref_name) }}
      DEPLOY_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.DEPLOY_REF }}

      - name: Create deployment bundle
        run: tar czf sqlution.tar.gz --exclude='.git' .

      - name: Upload bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: "sqlution.tar.gz"
          target: "/tmp"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_APP_DIR }}"
            TMP_DIR=$(mktemp -d)
            tar xzf /tmp/sqlution.tar.gz -C "$TMP_DIR"
            rsync -a --delete \
              --exclude '.env' \
              --exclude 'user_databases' \
              --exclude '.venv' \
              --exclude 'last_launched.txt' \
              "$TMP_DIR/" "$APP_DIR/"
            rm -rf "$TMP_DIR" /tmp/sqlution.tar.gz
            cd "$APP_DIR"
            bash launch.sh
