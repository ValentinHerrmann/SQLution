name: Deploy Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Git reference (tag or branch) to deploy"
        default: ""
        required: false

jobs:
  checkout:
    name: Checkout from Github
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sqlution.de
    env:
      DEPLOY_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || (inputs.deploy_ref != '' && inputs.deploy_ref || github.ref_name) }}
      DEPLOY_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout on Server over SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: DEPLOY_REF,DEPLOY_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_APP_DIR }}"
            git fetch origin --tags --prune
            git checkout "$DEPLOY_REF"
            git reset --hard "$DEPLOY_REF"
            if [ -z "${DEPLOY_TAG:-}" ] && [ -f VERSION ]; then
              BRANCH_NAME="${DEPLOY_REF##*/}"
              VERSION_VALUE=$(cat VERSION)
              echo "${VERSION_VALUE}-${BRANCH_NAME}" > VERSION
            fi
            export DEPLOY_TAG="$DEPLOY_REF"
            git pull origin "$DEPLOY_REF"
  stop:
    name: Stop running application
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sqlution.de
    env:
      DEPLOY_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || (inputs.deploy_ref != '' && inputs.deploy_ref || github.ref_name) }}
      DEPLOY_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop application over SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: DEPLOY_REF,DEPLOY_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_APP_DIR }}"
            mkdir -p tutorial/user_databases
            docker compose -f compose.yaml down
  build:
    name: Build new container
    needs: checkout
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sqlution.de
    env:
      DEPLOY_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || (inputs.deploy_ref != '' && inputs.deploy_ref || github.ref_name) }}
      DEPLOY_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build container via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: DEPLOY_REF,DEPLOY_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_APP_DIR }}"
            docker compose -f compose.yaml build --pull
  launch:
    name: Launch new container
    needs:
      - build
      - stop
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sqlution.de
    env:
      DEPLOY_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || (inputs.deploy_ref != '' && inputs.deploy_ref || github.ref_name) }}
      DEPLOY_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Launch container via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: DEPLOY_REF,DEPLOY_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_APP_DIR }}"
            docker compose -f compose.yaml up -d --remove-orphans
            rm -f ./last_launched.txt
            TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S TZ=Eu/Ber' > ./last_launched.txt
            