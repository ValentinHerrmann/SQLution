services:
  sqlution:
    image: sqlution
    container_name: sqlution-app
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 8000:8000
    environment:
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-sqlution.de,localhost,127.0.0.1}"
      SQLUTION_DB_DIR: /data
    restart: unless-stopped
    # Persist app data and cap memory usage
    volumes:
      - sqlution-db:/data
      - ${USER_DATABASES_PATH:-./user_databases}:/app/user_databases

volumes:
  sqlution-db:
