sonar.organization=valentinherrmann
sonar.projectKey=ValentinHerrmann_SQLution

# relative paths to source directories. More details and properties are described
# at https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-scope/
# Limit sources to the application package to avoid including tests twice
sonar.sources=tutorial/myapp

# Exclude test files from sources just in case, plus vendored/generated
# frontend bundles: the Apollon editor build (from SQLution_Apollon2,
# standalone/sqlution-embed) and the ACE editor.
sonar.exclusions=**/tests/**,**/tutorial/myapp/tests/**,\
  tutorial/myapp/staticfiles/apollon/apollon-sqlution.*,\
  tutorial/myapp/staticfiles/apollon/chunks/**,\
  tutorial/myapp/staticfiles/apollon/assets/**,\
  tutorial/myapp/staticfiles/ace-min-noconflict/**
# Test sources (relative path to test directories)
sonar.tests=tutorial/myapp/tests

sonar.python.version=3.13

# Coverage and test report paths (coverage.xml and junit xml produced by pytest)
# Sonar Python plugin will pick up these reports when present.
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml
