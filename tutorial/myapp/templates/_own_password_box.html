{% comment %}Card to change the own password. Used by user_management.html and db_users.html.{% endcomment %}
<div class="card um-card" id="own-password-box">
  <div class="card-body">
    <h5 class="card-title">Eigenes Passwort ändern</h5>
    <form method="post" action="{% url 'change_own_password' %}">
      {% csrf_token %}
      <div class="form-row">
        <div class="form-group col-md-4">
          <label for="old_password">Aktuelles Passwort</label>
          <input type="password" class="form-control" id="old_password" name="old_password" autocomplete="current-password" required>
        </div>
        <div class="form-group col-md-4">
          <label for="new_password1">Neues Passwort</label>
          <input type="password" class="form-control" id="new_password1" name="new_password1" autocomplete="new-password" required>
        </div>
        <div class="form-group col-md-4">
          <label for="new_password2">Neues Passwort wiederholen</label>
          <input type="password" class="form-control" id="new_password2" name="new_password2" autocomplete="new-password" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary"><i class="fas fa-key"></i> Passwort ändern</button>
    </form>
  </div>
</div>
