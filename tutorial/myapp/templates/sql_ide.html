{% extends "base.html" %} 
{% block title %}
SQLution - SQL IDE
{% endblock %}
{% block content %}
{% load static %}



</head>

<div class="main-flex-container">
    <div class="top-bar" style="display: flex; align-items: center; justify-content: space-between; gap: 1rem;">
        {% include 'sql_tutorial.html' %}
        <div class="flex-col margin-sm" style="align-items: flex-start; justify-content: flex-start; height: 100%;">
            
        </div>
    </div>
    <div class="sql-flex-grow">
        <div id="editor-parent" class="card-container" style="display: flex; justify-content: space-between; align-items: top; gap: 10px; padding: 10px; margin-top: 15px; min-height:60%; height:90%;">
            <div id="file-explorer" style="width:20%; min-width:150px; display:flex; flex-direction:column; margin-bottom: -5px">
                <div style="display:flex; align-items:center; justify-content:space-between; width:100%; gap:5px;">
                    <button id="save-sql-btn" class="btn btn-primary" style="font-size:1em; flex:1; min-width:0;"><i class="fas fa-save"></i></button>
                    <button id="sync-sql-btn" class="btn btn-primary" style="font-size:1em; flex:1; min-width:0;"><i class="fas fa-sync"></i></button>
                    <button id="add-sql-btn" class="btn btn-primary" style="font-size:1em; flex:1; min-width:0;"><i class="fas fa-plus"></i></button>
                    <button id="run-sql-btn" class="btn btn-primary" style="font-size:1em; flex:1; min-width:0;"><i class="fas fa-play"></i></button>
                </div>
                <div style="display:flex; align-items:center; justify-content:space-between;">
                    <h3 class="margin-sm" style="font-size:1rem;">SQL Dateien</h3>
                </div>
                <div style=" flex:1; min-height:0; overflow:hidden;">
                    <ul id="file-list" style="list-style:none; padding:0px; margin:0px; height:100%; overflow-y:auto; border:1px solid var(--border-color); border-radius:6px;">
                        <li style="padding:0px; color:var(--text-secondary);">Lade Dateien…</li>
                    </ul>
                </div>
            </div>
            <div style="display:flex; flex-direction:column; width:80%;">
                <div id="editor" data-user="{{ user_name }}" class="card-container" style="flex: 1; height:100%;"></div>
                <div id="sql-success" class="card-container" style="display:none; color: var(--text-primary); margin-top: 5px;"></div>
            </div>
            <script src="{% static 'ace-min-noconflict/ace.js' %}" type="text/javascript"></script>
            <script src="{% static 'ace-min-noconflict/ext-language_tools.js' %}"></script>
            <script src="{% static 'js/file_list.js' %}"></script>
            <script src="{% static 'js/sql_ide.js' %}"></script>
        </div>
        <!-- Container for AJAX-run results -->
        <div id="sql-results" class="card-container" style="background-color: var(--bg-secondary); margin-top: 10px; border-radius: 6px; padding: 0px"></div>
    </div>
</div>

{% endblock %}


{% block powered_by %}
<a href="https://github.com/ajaxorg/ace" target="_blank">
      Powered by ACE Editor
    </a>
{% endblock %}
